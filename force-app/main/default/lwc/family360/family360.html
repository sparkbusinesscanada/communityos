<template>
    <div class="f360">
        <template lwc:if={household}>
            <section class="hero">
                <div class="hero-top">
                    <template lwc:if={showBack}>
                        <lightning-button-icon icon-name="utility:back" variant="border-filled" alternative-text="Back to search"
                            onclick={handleBack} class="back"></lightning-button-icon>
                    </template>
                    <div class="avatar">{initials}</div>
                    <div class="hero-id">
                        <h1 class="hero-name" data-id={household.accountId} onclick={handleOpenRecord}>{household.name}</h1>
                        <p class="hero-sub">{heroSub}</p>
                        <template lwc:if={hasPeople}>
                            <div class="chips">
                                <template for:each={people} for:item="p">
                                    <button key={p.id} class="chip" data-id={p.id} onclick={handleOpenRecord}>
                                        <span class="chip-name">{p.title}</span>
                                        <template lwc:if={p.subtitle}><span class="chip-sub">{p.subtitle}</span></template>
                                    </button>
                                </template>
                            </div>
                        </template>
                    </div>
                </div>
                <div class="stats">
                    <template for:each={stats} for:item="s">
                        <div key={s.key} class={s.cls}>
                            <span class="stat-value">{s.value}</span>
                            <span class="stat-label">{s.label}</span>
                        </div>
                    </template>
                </div>
            </section>

            <div class="grid">
                <section class="panel">
                    <header class="panel-head"><h2>History</h2></header>
                    <lightning-tabset variant="scoped">
                        <template for:each={historyTabs} for:item="t">
                            <lightning-tab key={t.key} label={t.label}>
                                <template lwc:if={t.hasRows}>
                                    <ul class="rows">
                                        <template for:each={t.rows} for:item="r">
                                            <li key={r.id} class="row" data-id={r.id} onclick={handleOpenRecord}>
                                                <div class="row-main">
                                                    <span class="row-title">{r.title}</span>
                                                    <template lwc:if={r.badge}><span class="badge badge-quiet">{r.badge}</span></template>
                                                    <template lwc:if={r.subtitle}><div class="row-sub">{r.subtitle}</div></template>
                                                    <template lwc:if={r.body}><div class="row-body">{r.body}</div></template>
                                                </div>
                                                <template lwc:if={r.dateLabel}><span class="row-date">{r.dateLabel}</span></template>
                                            </li>
                                        </template>
                                    </ul>
                                </template>
                                <template lwc:else><p class="empty">{t.empty}</p></template>
                            </lightning-tab>
                        </template>
                    </lightning-tabset>
                </section>

                <section class="panel panel-accent">
                    <header class="panel-head">
                        <h2>Ask about this family</h2>
                        <div class="head-actions">
                            <lightning-button variant="base" label="All" onclick={handleSelectAll}></lightning-button>
                            <lightning-button variant="base" label="Clear" onclick={handleClearQuestions} class="slds-m-left_x-small"></lightning-button>
                        </div>
                    </header>
                    <div class="panel-body">
                        <lightning-checkbox-group name="deskQuestions" label="Questions" variant="label-hidden"
                            options={questionOptions} value={selectedKeys} onchange={handleQuestionChange}></lightning-checkbox-group>
                        <div class="ask-bar">
                            <lightning-button variant="brand" icon-name="utility:sparkles" label={askLabel}
                                onclick={handleAsk} disabled={askDisabled}></lightning-button>
                            <span class="hint">Answers cite the booking, order or note they came from and are saved to the family.</span>
                        </div>
                        <template lwc:if={asking}>
                            <div class="spinner-holder"><lightning-spinner alternative-text="Looking it up" size="small"></lightning-spinner></div>
                        </template>
                        <template lwc:if={deskError}><p class="error">{deskError}</p></template>
                        <template lwc:if={hasAnswers}>
                            <div class="answers">
                                <template for:each={answerCards} for:item="a">
                                    <article key={a.key} class="answer">
                                        <div class="answer-head">
                                            <span class="answer-q">{a.question}</span>
                                            <span class={a.badgeClass}>{a.badgeText}</span>
                                        </div>
                                        <p class="answer-text">{a.answer}</p>
                                        <div class="answer-foot">
                                            <template lwc:if={a.hasLinks}>
                                                <div class="sources">
                                                    <template for:each={a.sourceLinks} for:item="s">
                                                        <button key={s.label} class="source" data-id={s.recordId} onclick={handleOpenRecord}>{s.label}</button>
                                                    </template>
                                                </div>
                                            </template>
                                            <template lwc:if={a.canMark}>
                                                <div class="outcome">
                                                    <lightning-button label="Resolved" icon-name="utility:check" variant="neutral"
                                                        data-id={a.deskQuestionId} data-outcome="resolved" onclick={handleOutcome}></lightning-button>
                                                    <lightning-button label="Escalate" icon-name="utility:level_up" variant="neutral" class="slds-m-left_x-small"
                                                        data-id={a.deskQuestionId} data-outcome="escalated" onclick={handleOutcome}></lightning-button>
                                                </div>
                                            </template>
                                        </div>
                                    </article>
                                </template>
                            </div>
                        </template>
                        <template lwc:if={hasDeskHistory}>
                            <h3 class="sub-head">Recent questions</h3>
                            <ul class="rows">
                                <template for:each={deskHistory} for:item="r">
                                    <li key={r.id} class="row" data-id={r.id} onclick={handleOpenRecord}>
                                        <div class="row-main">
                                            <span class="row-title">{r.title}</span>
                                            <template lwc:if={r.body}><div class="row-sub clamp">{r.body}</div></template>
                                        </div>
                                        <div class="row-side">
                                            <span class={r.badgeClass}>{r.badge}</span>
                                            <span class="row-date">{r.dateLabel}</span>
                                        </div>
                                    </li>
                                </template>
                            </ul>
                        </template>
                    </div>
                </section>

                <div class="stack">
                    <section class="panel">
                        <header class="panel-head">
                            <h2>AI insights</h2>
                            <lightning-button label={insightsButtonLabel} icon-name="utility:sparkles" variant="brand-outline"
                                onclick={handleGetInsights} disabled={loadingInsights}></lightning-button>
                        </header>
                        <div class="panel-body">
                            <template lwc:if={loadingInsights}>
                                <div class="spinner-holder"><lightning-spinner alternative-text="Thinking" size="small"></lightning-spinner></div>
                            </template>
                            <template lwc:elseif={insights}>
                                <template lwc:if={insights.ok}>
                                    <p class="summary">{insights.summary}</p>
                                    <template lwc:if={hasInsightList}>
                                        <ul class="insights">
                                            <template for:each={insightList} for:item="i">
                                                <li key={i.key}><strong>{i.title}</strong> — {i.detail}</li>
                                            </template>
                                        </ul>
                                    </template>
                                    <template lwc:if={hasInsightTasks}>
                                        <h3 class="sub-head">Suggested tasks</h3>
                                        <template for:each={insightTasks} for:item="t">
                                            <div key={t.key} class="suggestion">
                                                <div class="suggestion-text">
                                                    <div class="row-title">{t.subject}</div>
                                                    <div class="row-sub">{t.reason}</div>
                                                    <div class="row-date">{t.dueLabel} · {t.relatedToken}</div>
                                                </div>
                                                <div class="suggestion-actions">
                                                    <lightning-button-icon icon-name="utility:add" variant="brand" alternative-text="Create task"
                                                        title="Create task" data-key={t.key} onclick={handleCreateTask}></lightning-button-icon>
                                                    <lightning-button-icon icon-name="utility:close" variant="bare" alternative-text="Dismiss"
                                                        title="Dismiss" data-key={t.key} onclick={handleDismissTask}></lightning-button-icon>
                                                </div>
                                            </div>
                                        </template>
                                    </template>
                                    <p class="fineprint">Model: {insights.model}. Names, contact details and health notes are masked before the AI sees them.</p>
                                </template>
                                <template lwc:else><p class="error">{insights.error}</p></template>
                            </template>
                            <template lwc:else><p class="empty">A short summary of this family and suggested next steps for staff.</p></template>
                        </div>
                    </section>

                    <section class="panel">
                        <header class="panel-head"><h2>Open tasks</h2></header>
                        <div class="panel-body">
                            <template lwc:if={hasOpenTasks}>
                                <ul class="rows">
                                    <template for:each={household.openTasks} for:item="r">
                                        <li key={r.id} class="row" data-id={r.id} onclick={handleOpenRecord}>
                                            <div class="row-main">
                                                <span class="row-title">{r.title}</span>
                                                <template lwc:if={r.badge}><span class="badge badge-ai">{r.badge}</span></template>
                                                <template lwc:if={r.body}><div class="row-sub">{r.body}</div></template>
                                            </div>
                                            <template lwc:if={r.dateLabel}><span class="row-date">{r.dateLabel}</span></template>
                                        </li>
                                    </template>
                                </ul>
                            </template>
                            <template lwc:else><p class="empty">Nothing open.</p></template>
                        </div>
                    </section>

                    <section class="panel">
                        <header class="panel-head"><h2>Add a staff note</h2></header>
                        <div class="panel-body">
                            <lightning-textarea label="Note" variant="label-hidden" placeholder="What happened, what they asked for, what was promised…"
                                value={noteText} onchange={handleNoteInput}></lightning-textarea>
                            <div class="note-bar">
                                <lightning-combobox class="note-member" label="Team member" variant="label-hidden"
                                    options={teamMemberOptions} value={noteTeamMember} onchange={handleTeamMember}></lightning-combobox>
                                <lightning-button label="Save note" variant="brand" onclick={handleSaveNote} disabled={noteDisabled}></lightning-button>
                            </div>
                        </div>
                    </section>
                </div>
            </div>
        </template>

        <template lwc:else>
            <section class="search-hero">
                <h1 class="search-title">Family 360</h1>
                <p class="search-sub">Find a family by phone, email or name.</p>
                <div class="search-box">
                    <lightning-input type="search" label="Search" variant="label-hidden" placeholder="e.g. 604 555 0199 or jane@example.com"
                        value={searchTerm} onchange={handleSearchInput} is-loading={searching}></lightning-input>
                </div>
                <template lwc:if={loadingHousehold}>
                    <div class="spinner-holder"><lightning-spinner alternative-text="Loading" size="small"></lightning-spinner></div>
                </template>
                <template lwc:if={hasHits}>
                    <ul class="hits">
                        <template for:each={hits} for:item="h">
                            <li key={h.accountId} class="hit" data-id={h.accountId} onclick={handleSelectHit}>
                                <div>
                                    <div class="row-title">{h.name}</div>
                                    <div class="row-sub">{h.people}</div>
                                </div>
                                <span class="row-date">{h.phone}</span>
                            </li>
                        </template>
                    </ul>
                </template>
                <template lwc:if={showNoResults}><p class="empty">No household found.</p></template>
            </section>
        </template>
    </div>
</template>
